baseURL = 'http://example.org/'
languageCode = 'en-us'
title = 'Cloudy Mountains'

[params]
  description = "Welcome to Cloudy Mountains - Your Journey to the Clouds"
  heroBackgroundImage = "/images/forest-background.jpg"
  heroTitle = "Welcome to Cloudy Mountains"
  heroSubtitle = "Your Journey to the Clouds"
  about_title = "About Me"
  about_text = "I am passionate about connecting people with the beauty and serenity of nature. My mission is to inspire and educate while preserving the natural wonders around us."
  first_title = "Cloud"
  first_text = "Expertise in cloud infrastructure and services"
  second_title = "Automation"
  second_text = "Streamlining processes through automation"
  third_title = "DevOps"
  third_text = "Bridging development and operations"
  fourth_title = "Platform Engineering"
  fourth_text = "Building robust and scalable platforms"
  linkedin = "https://linkedin.com/in/yourusername"
  email = "contact@forestdreams.com"
  github = "https://github.com/yourusername"

  # About section: experience counters + My Skills (override in site config)
  experience_start_year = 2020  # Years of experience = current year − this year
  companies_count = 3
  counter_three_label = "Projects"
  counter_three_value = 20
  counter_four_label = "Cups of coffee"
  counter_four_value = 999
  [[params.skills]]
    name = "Kubernetes"
    percent = 80
  [[params.skills]]
    name = "Terraform"
    percent = 85

  # SEO Settings
  [params.seo]
    googleAnalytics = "UA-XXXXXXXXX-X"  # Replace with your Google Analytics ID
    googleSiteVerification = "your-verification-code"  # For Google Search Console
    keywords = ["cloud", "automation", "devops", "platform engineering"]
    author = "Your Name"
    copyright = "© 2024 Cloudy Mountains. All rights reserved."
    
    # Iubenda Consent Manager
    [params.seo.iubenda]
      enable = false  # Set to true to enable consent manager
      siteId = "your-site-id"  # Replace with your Iubenda site ID
      cookiePolicyId = "your-cookie-policy-id"  # Replace with your cookie policy ID
      lang = "en"

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "About me"
    url = "/#about"
    weight = 2
  [[menu.main]]
    name = "Projects"
    url = "/#projects"
    weight = 3
  [[menu.main]]
    name = "CV"
    url = "/cv/"
    weight = 4
  [[menu.main]]
    name = "Contacts"
    url = "/#contacts"
    weight = 5

[module]
  [module.hugoVersion]
    extended = true
    min = '0.146.0'

[outputs]
  home = ["HTML", "RSS", "JSON"]

[build]
  writeStats = true
  noJSBundleInAssets = true
  useResourceCacheWhen = "fallback"

# SEO Settings
[permalinks]
  posts = "/:year/:month/:title/"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    hl_Lines = ''
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = true
    noClasses = false
    style = 'monokai'
    tabWidth = 4
